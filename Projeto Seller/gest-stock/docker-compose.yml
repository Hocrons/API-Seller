services:
  mysql57:
    image: mysql:8.0.29
    restart: unless-stopped
    container_name: db

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: market_management

    volumes:
      - .db:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - .:/src

    env_file:
      - .env

    environment:
      FLASK_APP: run.py
      FLASK_ENV: development

    depends_on:
      - mysql57